<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>تقویم ۱۴۰۴</title>
  
  <!-- === تغییرات جدید برای PWA === -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0056b3"/>
  <link rel="manifest" href="./manifest.json">
  <!-- ============================== -->

  <link rel="stylesheet" href="./style2.css">
</head>
<body>

  <div class="calendar-wrapper">
    <div class="calendar-header">
      <button id="prev-month" class="nav-button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
      
      <div id="month-year-display-wrapper">
        <div class="month-selector-container">
          <select id="month-selector"></select>
          <span id="year-display"></span>
        </div>
        <div id="subtitle-display" class="subtitle"></div>
        <button id="goto-today" class="today-button">امروز</button>
      </div>

      <button id="next-month" class="nav-button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
    </div>
    
    <div class="calendar-main-content">
      <div id="calendar-grid"></div>
      <div id="events-container"></div>
    </div>
  </div>

  <!-- ترتیب صحیح بارگذاری: داده‌ها اول، سپس منطق -->
  <script src="./calendar-master-data.js"></script>
  <script src="./events.js"></script>
  <script src="./calendar-logic.js"></script>
  
  <!-- === اسکریپت جدید برای ثبت سرویس ورکر === -->
  <script src="./app.js"></script>

</body>
</html>
